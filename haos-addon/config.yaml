name: Activity Sink
version: "0.3.0"
slug: activity_sink
description: Append-only local activity event sink
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
ports:
  8788/tcp: 8788
ports_description:
  8788/tcp: Activity ingest API
# The panel port is absent from `ports` on purpose. Home Assistant reaches it
# over the Supervisor network and authenticates every request itself, so the
# read side is never exposed to the LAN the way the ingest port is.
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant
panel_title: Activity
map:
  - data:rw
options:
  write_token: ""
schema:
  write_token: str
