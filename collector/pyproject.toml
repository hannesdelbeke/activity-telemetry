[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-collector"
version = "0.1.0"
description = "Privacy-preserving local activity collector for personal computers"
requires-python = ">=3.11"

[project.scripts]
activity-collector = "activity_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
